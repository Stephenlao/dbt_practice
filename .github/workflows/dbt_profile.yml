name: dbt CI/CD Pipeline

# Định nghĩa các sự kiện kích hoạt Pipeline
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  dbt_transformation:
    runs-on: ubuntu-latest

    # Truyền Secrets từ GitHub Settings vào Environment Variables của Runner
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN_PROJ_1: ${{ secrets.DATABRICKS_TOKEN_PROJ_1 }}
      DATABRICKS_TOKEN_UAT: ${{ secrets.DATABRICKS_TOKEN_UAT }}
      DATABRICKS_TOKEN_PROD: ${{ secrets.DATABRICKS_TOKEN_PROD }}

    steps:
      # 1. Checkout source code từ GitHub về máy ảo
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Cài đặt dbt-databricks
      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks

      # 4. TRƯỜNG HỢP 1: Chạy CI lên DEV Schema khi tạo/update Pull Request
      - name: Run dbt for DEV (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          dbt deps
          dbt build --target dev

      # 5. TRƯỜNG HỢP 2: Chạy CD lên UAT Schema khi Merge code vào nhánh main
      - name: Run dbt for UAT (Push to Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dbt deps
          dbt build --target uat

      # 6. TRƯỜNG HỢP 3: Chạy CD lên PROD Schema khi gắn Git Tag (Ví dụ: v1.0.0)
      - name: Run dbt for PROD (Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dbt deps
          dbt build --target prod